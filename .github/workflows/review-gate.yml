# review-gate-refresh — re-run the counted CI job named `review-gate`.
#
# Why this file must not publish a check:
#   ruleset 23222371 requires a GitHub Actions (app 15368) check named
#   `review-gate` with strict up-to-date. `checks.create` attaches the run to
#   the oldest Actions check suite on the head SHA. When that suite came from
#   this pull_request_target workflow (PR #88, head d599169) GitHub rejected
#   the merge with 405 "Required status check review-gate is expected" even
#   though a successful review-gate check run existed. When the oldest suite
#   came from the pull_request CI workflow (PR #87) the same API result
#   counted. A job named exactly `review-gate` in `.github/workflows/ci.yml`
#   is recorded on the pull_request suite, which GitHub always counts.
#
#   Re-evaluation (Codex review/comment, waiver label, base edit) therefore
#   reruns that CI job via the Actions API. This workflow never calls
#   checks.create, so it cannot leave orphaned in_progress
#   "Evaluating Codex review" runs and cannot land a result in the wrong suite.
#
# Security:
#   pull_request_target / issue_comment / schedule run the copy on the default
#   branch. Checkout is pinned to default_branch with persist-credentials
#   false, so PR code is never executed here and no repo secrets are passed.
#   pull_request_review uses the PR's workflow file (GitHub platform limit);
#   that copy can only rerun the CI job named review-gate. Evaluation itself
#   reads PR data only through the API with the CI job's read-only token.
#
# Pass conditions stay the ones in scripts/review-gate.mjs (includes #88):
#   1. A non-dismissed chatgpt-codex-connector[bot] review on the current
#      head SHA or a 7+ hex prefix of it, after the last base change; or a
#      clean Codex summary / "no major issues" comment that names such a
#      prefix and does not mention any other SHA. A dismissed Codex review
#      on this head blocks the clean-comment fallback.
#   2. Bill-only (`up2itnow0822`) `codex-waived`, valid only while this head
#      is current (label after last base change and last head move).
#   GitHub 5xx responses are retried with backoff.
#
# Residual risk (GitHub platform limit): any other pull_request workflow with
# a job named `review-gate` can also produce the required context. Keep
# repository default workflow permissions read-only and review changes under
# .github/workflows/ with that in mind.

name: review-gate-refresh

on:
  pull_request_target:
    types: [labeled, unlabeled, edited, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted, edited, dismissed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to re-evaluate (optional; schedule refreshes failing gates)"
        required: false

permissions:
  contents: read
  actions: write
  issues: read
  pull-requests: read

concurrency:
  group: >-
    review-gate-refresh-${{
      github.event.pull_request.number ||
      github.event.issue.number ||
      github.event.inputs.pr_number ||
      format('run-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  refresh:
    if: >
      github.event_name == 'pull_request_target' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Re-run CI review-gate job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/review-gate.mjs rerun
