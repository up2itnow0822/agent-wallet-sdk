# review-gate-refresh — re-run the counted CI job named `review-gate`.
#
# Why this file must not publish a check:
#   ruleset 23222371 requires a GitHub Actions (app 15368) check named
#   `review-gate` with strict up-to-date. `checks.create` attaches the run to
#   the oldest Actions check suite on the head SHA. When that suite came from
#   this pull_request_target workflow (PR #88, head d599169) GitHub rejected
#   the merge with 405 "Required status check review-gate is expected" even
#   though a successful review-gate check run existed. When the oldest suite
#   came from the pull_request CI workflow (PR #87) the same API result
#   counted. A job named exactly `review-gate` in `.github/workflows/ci.yml`
#   is recorded on the pull_request suite, which GitHub always counts.
#
#   Re-evaluation (trusted Codex comments, Bill's waiver label, base
#   retarget, ready/reopen) therefore reruns that CI job via the Actions API.
#   This workflow never calls checks.create, so it cannot leave orphaned
#   in_progress "Evaluating Codex review" runs and cannot land a result in
#   the wrong suite.
#
# Security:
#   No checkout. The rerun lives in this workflow file. Triggers are only
#   events GitHub runs from the default-branch copy (pull_request_target,
#   issue_comment, schedule, workflow_dispatch). The refresh job then
#   filters to trusted evidence: Codex bot comments, Bill's `codex-waived`
#   label (via record-waiver, then refresh), base retarget, ready/reopen,
#   schedule, and dispatch. Author comments, title/body edits, junk labels,
#   and github-actions[bot] comments (security-review.yml can post those)
#   do not rerun. pull_request_review is omitted on purpose: GitHub would
#   execute the PR's workflow file with actions: write. Codex reviews still
#   arrive as issue comments or are picked up when the schedule rechecks.
#   No repo secrets are passed. Evaluation reads PR data only through the
#   API with the CI job's read-only token, using the evaluator fetched from
#   the base SHA.
#   Fork PRs can have an empty workflow_run.pull_requests[] (actions/runner
#   #3444). Refresh matches those runs by head SHA + head repo + branch,
#   and fails closed when several open PRs share a SHA and the run is
#   ambiguous.
#
# Pass conditions stay the ones in scripts/review-gate.mjs (includes #88):
#   1. A non-dismissed chatgpt-codex-connector[bot] review on the current
#      head SHA or a 7+ hex prefix that uniquely resolves to that head,
#      posted after GitHub's push/event time for the head; or a clean Codex
#      summary / "no major issues" comment under the same rules. A dismissed
#      Codex review on this head blocks the clean-comment fallback.
#   2. Bill-only (`up2itnow0822`) `codex-waived`, bound to head SHA + base
#      ref + base SHA + PR by a github-actions[bot] comment that cites the
#      review-gate-refresh run which wrote it. Evaluate requires that run's
#      path to be this file, event pull_request_target (main's copy), and a
#      successful record-waiver job. A PR-controlled workflow posting as
#      the same bot cannot mint that provenance.
#   A Codex review counts only as a clean no-findings / "no major issues"
#   result, never merely because a review exists.
#   GitHub 5xx responses are retried with backoff.
#
# Rerun budget: schedule polling of *waiting* (non-success) gates caps at
# MAX_RUN_ATTEMPTS (8), well under GitHub's 50-rerun-per-run limit.
# Green counted checks keep being revalidated after that so a later
# formal Codex dismissal cannot stick (pull_request_review is omitted
# because GitHub would run the PR's copy with actions: write). Trusted
# Codex comments, waiver labels, and manual dispatch still rerun after
# the waiting cap. Untrusted comments never call reRunJobForWorkflowRun.
# Schedule backs off (10 / 20 / 40 / 80 min). A new push opens a new run.
#
# Residual risk (GitHub platform limit): any other pull_request workflow with
# a job named `review-gate` can also produce the required context, and a PR
# can edit its own ci.yml to skip the base-SHA fetch. See CONTRIBUTING.md.
# Keep repository default workflow permissions read-only.

name: review-gate-refresh

on:
  pull_request_target:
    types: [labeled, unlabeled, edited, ready_for_review, reopened]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to re-evaluate (optional; schedule refreshes failing gates)"
        required: false

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: read

concurrency:
  group: >-
    review-gate-refresh-${{
      github.event.pull_request.number ||
      github.event.issue.number ||
      github.event.inputs.pr_number ||
      format('run-{0}', github.run_id)
    }}
  # Never cancel. Untrusted comments / title edits still start a skipped
  # run; cancelling would let them clobber a Codex or waiver refresh.
  cancel-in-progress: false

jobs:
  record-waiver:
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'codex-waived' &&
      github.event.sender.login == 'up2itnow0822'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Bind waiver to head, base, PR, and this trusted run
        uses: actions/github-script@v7
        with:
          script: |
            const WAIVE_LABEL = 'codex-waived';
            const WAIVER_MARKER = '<!-- review-gate-waiver:v1';
            const WORKFLOW_PATH = '.github/workflows/review-gate.yml';

            function fullSha(value) {
              return typeof value === 'string' && /^[0-9a-f]{40}$/i.test(value)
                ? value.toLowerCase()
                : '';
            }

            const pr = context.payload.pull_request;
            const n = pr && pr.number;
            const headSha = fullSha(pr && pr.head && pr.head.sha);
            const base = pr && pr.base && pr.base.ref;
            const baseSha = fullSha(pr && pr.base && pr.base.sha);
            const actor = context.payload.sender && context.payload.sender.login;
            if (!n || !headSha || !base || !baseSha || !actor) {
              core.setFailed('waiver payload missing head/base SHA or actor');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: n,
              per_page: 100,
            });
            const rec = {
              sha: headSha,
              base,
              baseSha,
              actor,
              pr: n,
              run: context.runId,
              workflow: WORKFLOW_PATH,
            };
            const already = comments.some(c =>
              c.user && c.user.login === 'github-actions[bot]' &&
              c.body && c.body.includes(WAIVER_MARKER) &&
              c.body.includes(`"sha":"${headSha}"`) &&
              c.body.includes(`"baseSha":"${baseSha}"`) &&
              c.body.includes(`"run":${context.runId}`)
            );
            if (already) {
              core.info(`#${n}: waiver record already bound for this run`);
              return;
            }
            const body = `${WAIVER_MARKER} ${JSON.stringify(rec)} -->\n` +
              `review-gate: \`${WAIVE_LABEL}\` bound to head \`${headSha}\` base \`${base}\` ` +
              `(\`${baseSha}\`) by \`${actor}\` on PR #${n} via run ${context.runId}.`;
            const delays = [1000, 2000, 4000];
            let last;
            for (let i = 0; i <= delays.length; i++) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: n,
                  body,
                });
                last = null;
                break;
              } catch (err) {
                last = err;
                const status = err && err.status;
                if (!(status >= 500 && status <= 599) || i === delays.length) throw err;
                await new Promise(r => setTimeout(r, delays[i]));
              }
            }
            if (last) throw last;
            core.info(`#${n}: recorded unforgeable waiver binding run ${context.runId}`);

  refresh:
    needs: [record-waiver]
    if: >
      always() &&
      (needs.record-waiver.result == 'success' || needs.record-waiver.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          (
            github.event.comment.user.login == 'chatgpt-codex-connector[bot]' ||
            github.event.comment.user.login == 'chatgpt-codex-connector'
          )
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          (
            github.event.action == 'ready_for_review' ||
            github.event.action == 'reopened' ||
            (
              github.event.action == 'unlabeled' &&
              github.event.label.name == 'codex-waived'
            ) ||
            (
              github.event.action == 'labeled' &&
              github.event.label.name == 'codex-waived' &&
              github.event.sender.login == 'up2itnow0822'
            ) ||
            (
              github.event.action == 'edited' &&
              github.event.changes.base != null
            )
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Re-run CI review-gate job
        uses: actions/github-script@v7
        with:
          script: |
            const CI_WORKFLOW = 'ci.yml';
            const JOB_NAME = 'review-gate';
            const MAX_RUN_ATTEMPTS = 8;
            const SCHEDULE_INTERVAL_MS = 10 * 60 * 1000;

            async function withRetry(fn, label) {
              const delays = [1000, 2000, 4000];
              let last;
              for (let i = 0; i <= delays.length; i++) {
                try {
                  return await fn();
                } catch (err) {
                  last = err;
                  const status = err && err.status;
                  if (!(status >= 500 && status <= 599) || i === delays.length) throw err;
                  core.warning(`${label}: GitHub API ${status}, retrying in ${delays[i]}ms`);
                  await new Promise(r => setTimeout(r, delays[i]));
                }
              }
              throw last;
            }

            function fullSha(value) {
              return typeof value === 'string' && /^[0-9a-f]{40}$/i.test(value)
                ? value.toLowerCase()
                : '';
            }

            function runMatchesPr(run, prNumber) {
              return (run.pull_requests || []).some(p => Number(p.number) === Number(prNumber));
            }

            function runIsUnattributed(run) {
              return ((run && run.pull_requests) || []).length === 0;
            }

            function headRepoFullName(pr) {
              const name = pr && pr.head && pr.head.repo && pr.head.repo.full_name;
              return typeof name === 'string' ? name : '';
            }

            function runHeadRepoFullName(run) {
              const name = run && run.head_repository && run.head_repository.full_name;
              return typeof name === 'string' ? name : '';
            }

            function runMatchesUnattributedHead(run, pr) {
              if (!run || !pr || !runIsUnattributed(run)) return false;
              const sha = fullSha(pr.head && pr.head.sha);
              const branch = (pr.head && pr.head.ref) || '';
              const repoName = headRepoFullName(pr);
              if (!sha || !branch || !repoName) return false;
              if (fullSha(run.head_sha) !== sha) return false;
              if ((run.head_branch || '') !== branch) return false;
              return runHeadRepoFullName(run) === repoName;
            }

            function latestCiRun(runs) {
              return (runs || []).slice().sort((a, b) => {
                const byNumber = (b.run_number || 0) - (a.run_number || 0);
                if (byNumber !== 0) return byNumber;
                return Date.parse(b.created_at || 0) - Date.parse(a.created_at || 0);
              })[0] || null;
            }

            function selectCiRun(runs, { prNumber, pr, headIsUnique } = {}) {
              const ci = (runs || []).filter(r => r.event === 'pull_request');
              const numbered = ci.filter(r => runMatchesPr(r, prNumber));
              if (numbered.length > 0) return latestCiRun(numbered);
              const unattributed = ci.filter(runIsUnattributed);
              const headMatched = unattributed.filter(r => runMatchesUnattributedHead(r, pr));
              if (headMatched.length > 0) return latestCiRun(headMatched);
              if (headIsUnique && unattributed.length === 1) return unattributed[0];
              return null;
            }

            function runAttemptCount(run) {
              const n = Number(run && run.run_attempt);
              return Number.isFinite(n) && n > 0 ? n : 1;
            }

            function scheduleBackoffMs(attempt) {
              const exp = Math.min(Math.max((Number(attempt) || 1) - 1, 0), 3);
              return SCHEDULE_INTERVAL_MS * (2 ** exp);
            }

            async function resolvePrNumbers() {
              if (context.payload.pull_request) return [context.payload.pull_request.number];
              if (context.payload.issue && context.payload.issue.pull_request) {
                return [context.payload.issue.number];
              }
              if (context.payload.inputs && context.payload.inputs.pr_number) {
                const n = parseInt(context.payload.inputs.pr_number, 10);
                if (!Number.isFinite(n)) throw new Error(`bad pr_number: ${context.payload.inputs.pr_number}`);
                return [n];
              }
              if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
                const prs = await github.paginate(github.rest.pulls.list, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                  per_page: 100,
                });
                return prs.map(pr => pr.number);
              }
              return [];
            }

            async function waitForRun(runId) {
              const deadline = Date.now() + 8 * 60 * 1000;
              for (;;) {
                const { data: run } = await withRetry(
                  () => github.rest.actions.getWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: runId,
                  }),
                  `run ${runId}`,
                );
                if (run.status === 'completed') return run;
                if (Date.now() >= deadline) return run;
                await new Promise(r => setTimeout(r, 10000));
              }
            }

            const numbers = await resolvePrNumbers();
            if (numbers.length === 0) {
              core.info('No pull requests to refresh.');
              return;
            }

            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            for (const n of numbers) {
              const { data: pr } = await withRetry(
                () => github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: n,
                }),
                `pr ${n}`,
              );
              const headSha = fullSha(pr.head && pr.head.sha);
              if (!headSha) {
                core.info(`#${n}: skip, head is not a 40-character SHA`);
                continue;
              }

              const headIsUnique = openPrs.filter(p =>
                fullSha(p.head && p.head.sha) === headSha
              ).length <= 1;

              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: CI_WORKFLOW,
                head_sha: headSha,
                event: 'pull_request',
                per_page: 100,
              });
              let run = selectCiRun(runs, { prNumber: n, pr, headIsUnique });
              if (!run) {
                core.info(`#${n} ${headSha.slice(0, 7)}: no pull_request CI run for this PR on this head yet`);
                continue;
              }

              if (run.status !== 'completed') {
                if (context.eventName === 'schedule') {
                  core.info(`#${n}: schedule skip (${run.status})`);
                  continue;
                }
                core.info(`#${n}: waiting for CI run ${run.id} (${run.status})`);
                run = await waitForRun(run.id);
                if (run.status !== 'completed') {
                  core.info(`#${n}: CI run ${run.id} still ${run.status}; schedule will retry`);
                  continue;
                }
              }

              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const job = jobs.find(j => j.name === JOB_NAME);
              if (!job) {
                core.info(`#${n}: CI run ${run.id} has no ${JOB_NAME} job`);
                continue;
              }

              if (context.eventName === 'schedule' &&
                  runAttemptCount(run) >= MAX_RUN_ATTEMPTS &&
                  job.conclusion !== 'success') {
                core.info(`#${n}: schedule capped (run ${run.id} attempt ${runAttemptCount(run)}/${MAX_RUN_ATTEMPTS})`);
                continue;
              }

              if (context.eventName === 'schedule') {
                const completedMs = Date.parse(job.completed_at || run.updated_at || 0);
                const backoffMs = scheduleBackoffMs(runAttemptCount(run));
                if (Number.isFinite(completedMs) && Date.now() - completedMs < backoffMs) {
                  core.info(`#${n}: schedule backoff (${backoffMs}ms, attempt ${runAttemptCount(run)})`);
                  continue;
                }
              }

              try {
                await withRetry(
                  () => github.rest.actions.reRunJobForWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    job_id: job.id,
                  }),
                  `rerun ${job.id}`,
                );
                core.info(`#${n}: reran ${JOB_NAME} job ${job.id} on run ${run.id}`);
              } catch (err) {
                const status = err && err.status;
                if (status === 403 || status === 409 || status === 422) {
                  core.info(`#${n}: rerun skipped (${status} ${err.message})`);
                  continue;
                }
                throw err;
              }
            }
