# review-gate — required status check that fails until Codex has finished
# reviewing the current head commit (or Bill applied the codex-waived label).
#
# Why: CI goes green minutes before chatgpt-codex-connector posts. Agents
# merging on Bill's token (and cursor[bot]) were landing money-rail PRs in
# that window. Thread-resolution rules cannot block on threads that do not
# exist yet. This check is published via checks.create as github-actions
# (app id 15368) so a PAT cannot fake it.
#
# Pass conditions (any one):
#   1. A chatgpt-codex-connector[bot] (user.type == Bot) review exists with
#      commit_id == head SHA
#   2. Label `codex-waived` is present AND the most recent `labeled` event for
#      it was performed by an allow-listed waiver actor (WAIVER_ACTORS)
#
# Commit statuses are deliberately NOT accepted as Codex evidence: anyone with
# statuses:write can post a status with any context name.
#
# Fail-closed: Codex usage-limit comments without a head review keep the
# gate red. Do NOT enable repo allow_auto_merge until this check is required.
#
# Trigger hardening: every trigger here runs the workflow definition from the
# default branch, never from the PR (pull_request_target instead of
# pull_request; no pull_request_review, which would execute the PR's copy).
# A PR that edits this file therefore cannot change how its own gate is
# evaluated. The workflow never checks out or executes PR content. Codex
# reviews are picked up by the 10-minute schedule, the next PR comment, or a
# manual workflow_dispatch.

name: review-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  issue_comment:
    types: [created]
  check_suite:
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to evaluate (optional; schedule evaluates all open)"
        required: false

permissions:
  contents: read
  checks: write
  issues: read
  pull-requests: read

concurrency:
  group: review-gate-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Job name is NOT the required check name. The required context is the
  # Check Run named "review-gate" created below, pinned to the PR head SHA.
  publish:
    if: >
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'check_suite' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Evaluate and publish review-gate
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const CODEX_LOGINS = new Set([
              'chatgpt-codex-connector',
              'chatgpt-codex-connector[bot]',
            ]);
            const WAIVE_LABEL = 'codex-waived';
            // Only these accounts may authorize a waiver. Label presence alone
            // is not trusted; the labeled-event actor is verified.
            const WAIVER_ACTORS = new Set(['up2itnow0822']);
            const CHECK_NAME = 'review-gate';

            function isCodexLogin(login) {
              return !!login && CODEX_LOGINS.has(login);
            }

            function isCodexUser(user) {
              return !!user && user.type === 'Bot' && isCodexLogin(user.login);
            }

            async function waiverActor(prNumber) {
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              let last = null;
              for (const e of events) {
                if ((e.event === 'labeled' || e.event === 'unlabeled') &&
                    e.label && e.label.name === WAIVE_LABEL) {
                  last = e;
                }
              }
              if (!last || last.event !== 'labeled') return null;
              return (last.actor && last.actor.login) || null;
            }

            async function resolvePrNumbers() {
              if (context.payload.pull_request) {
                return [context.payload.pull_request.number];
              }
              if (context.payload.issue && context.payload.issue.pull_request) {
                return [context.payload.issue.number];
              }
              if (context.payload.inputs && context.payload.inputs.pr_number) {
                const n = parseInt(context.payload.inputs.pr_number, 10);
                if (!Number.isFinite(n)) throw new Error(`bad pr_number: ${context.payload.inputs.pr_number}`);
                return [n];
              }
              // schedule / check_suite: every non-draft open PR
              const prs = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              return prs.filter(pr => !pr.draft).map(pr => pr.number);
            }

            async function evaluate(prNumber) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              const headSha = pr.head.sha;
              const labels = (pr.labels || []).map(l => l.name);

              if (labels.includes(WAIVE_LABEL)) {
                const actor = await waiverActor(prNumber);
                if (actor && WAIVER_ACTORS.has(actor)) {
                  return {
                    prNumber, headSha,
                    conclusion: 'success',
                    title: 'Codex waived',
                    summary: `Label \`${WAIVE_LABEL}\` applied by @${actor} (allow-listed waiver actor).`,
                  };
                }
                core.warning(`Label ${WAIVE_LABEL} on #${prNumber} applied by ${actor || 'unknown'}; not an allow-listed waiver actor, ignoring.`);
              }
              if (pr.draft) {
                return {
                  prNumber, headSha,
                  conclusion: 'neutral',
                  title: 'Draft PR',
                  summary: 'Draft PRs are not gated; mark ready for review to require Codex.',
                };
              }

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              });
              const codexOnHead = reviews.filter(r => {
                const commitId = r.commit_id || '';
                return isCodexUser(r.user) && commitId === headSha;
              });

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              const usageLimited = comments.some(c => {
                const body = c.body || '';
                return isCodexUser(c.user) && /usage limits?/i.test(body);
              });

              if (codexOnHead.length > 0) {
                return {
                  prNumber, headSha,
                  conclusion: 'success',
                  title: 'Codex reviewed head',
                  summary: `chatgpt-codex-connector reviewed \`${headSha.slice(0, 7)}\` (${codexOnHead.length} review(s)).`,
                };
              }

              if (usageLimited) {
                return {
                  prNumber, headSha,
                  conclusion: 'failure',
                  title: 'Codex unavailable (usage limit)',
                  summary: `Codex hit usage limits and has not reviewed \`${headSha.slice(0, 7)}\`. ` +
                    `Fail-closed: apply \`${WAIVE_LABEL}\` only with Bill's explicit GO, or wait for quota.`,
                };
              }

              return {
                prNumber, headSha,
                conclusion: 'failure',
                title: 'Waiting for Codex on head',
                summary: `No chatgpt-codex-connector review on \`${headSha.slice(0, 7)}\` yet. ` +
                  `CI alone is not enough. Gate stays red until Codex finishes or \`${WAIVE_LABEL}\` is applied.`,
              };
            }

            const numbers = await resolvePrNumbers();
            if (numbers.length === 0) {
              core.info('No open non-draft PRs to evaluate.');
              return;
            }

            // The job itself always succeeds: the gate verdict lives only in
            // the `review-gate` check run on the PR head. (Under
            // pull_request_target / schedule the job's own check attaches to
            // the base branch, so failing it would only paint main red.)
            for (const n of numbers) {
              const result = await evaluate(n);
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: CHECK_NAME,
                head_sha: result.headSha,
                status: 'completed',
                conclusion: result.conclusion,
                output: {
                  title: result.title,
                  summary: result.summary,
                },
              });
              core.info(`PR #${result.prNumber} @ ${result.headSha.slice(0, 7)} -> ${result.conclusion}: ${result.title}`);
            }
            core.info(`Published review-gate for ${numbers.length} PR(s).`);
