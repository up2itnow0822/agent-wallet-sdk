# review-gate — required status check that fails until Codex has finished
# reviewing the current head commit (or Bill applied the codex-waived label).
#
# Why: CI goes green minutes before chatgpt-codex-connector posts. Agents
# merging on Bill's token (and cursor[bot]) were landing money-rail PRs in
# that window. Thread-resolution rules cannot block on threads that do not
# exist yet. This check is published via checks.create as github-actions
# (app id 15368) so a PAT cannot fake it.
#
# Pass conditions (any one):
#   1. A non-dismissed chatgpt-codex-connector[bot] (user.type == Bot) review
#      exists with commit_id exactly equal to the 40-character head SHA,
#      submitted after the PR's most recent base-branch change; or, for a
#      clean pass (Codex submits no review when it has no findings), the
#      Codex bot's own review-summary comment reports
#      `Code Review | Completed | <head sha or prefix ≥7 of this head>`
#      and was updated after the last base change. A Codex "Didn't find
#      any major issues" issue comment also counts, but only when it
#      names a SHA that is a prefix of the current head. Prefixes are
#      compared to the current head SHA only — never resolved against
#      other commits. Comments that mention any SHA that is not a prefix
#      of the current head do not count. A dismissed Codex review on
#      this head blocks the clean-summary fallback. Matchers are
#      specified in scripts/review-gate-evidence.js (the workflow cannot
#      check out PR content, so the helpers are inlined below).
#      Findings arrive as review threads, which the ruleset's
#      thread-resolution rule blocks separately.
#   2. Waiver bound to this PR's label event and current base: an
#      allow-listed actor (WAIVER_ACTORS) applied `codex-waived` while this
#      exact head SHA was current AND after the last base retarget. The
#      labeled event publishes a "Codex waived" review-gate check on that
#      SHA; later evaluations honor the waiver only if that check exists on
#      the current head AND the label's current LabeledEvent (server time,
#      allow-listed actor) post-dates the last base change. Any push
#      produces a new head with no waiver; re-apply the label to waive again.
#
# A check run belongs to a commit, not a PR, so the verdict for a SHA is
# success only if EVERY open PR whose head is that SHA passes. Open PRs
# sharing the SHA are re-listed immediately before a success is published.
#
# Concurrency is per-PR so an event on PR B cannot replace a queued
# reevaluation of PR A. Events without a PR number (schedule, check_suite,
# dispatch-all) use a unique run id and never join another PR's group.
#
# The first step posts an in_progress review-gate check on each target SHA
# before evaluation can fail, so a required check never stays green across a
# crashed or cancelled run. Review/waiver evidence is re-read immediately
# before any success is published.
#
# Draft PRs get a failing gate (not neutral), so marking a draft ready can
# never expose an already-satisfied required check.
#
# Commit statuses are deliberately NOT accepted as Codex evidence: anyone with
# statuses:write can post a status with any context name.
#
# Fail-closed: Codex usage-limit comments without a head review keep the
# gate red. Do NOT enable repo allow_auto_merge until this check is required.
#
# Trigger hardening: every trigger here runs the workflow definition from the
# default branch, never from the PR (pull_request_target instead of
# pull_request; no pull_request_review, which would execute the PR's copy).
# A PR that edits this file therefore cannot change how its own gate is
# evaluated. The workflow never checks out or executes PR content. Codex
# reviews (and review dismissals) are picked up by the 10-minute schedule, the
# next PR comment, or a manual workflow_dispatch. Base retargets re-run via
# the `edited` action.
#
# Residual risk (GitHub platform limit): any other workflow that runs from PR
# code with `checks: write` can also create a check run named `review-gate`
# as github-actions. Keep repository default workflow permissions read-only
# and review changes under .github/workflows/ with that in mind.

name: review-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
  issue_comment:
    types: [created]
  check_suite:
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to evaluate (optional; schedule evaluates all open)"
        required: false

permissions:
  contents: read
  checks: write
  issues: read
  pull-requests: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number ||
      github.event.issue.number ||
      github.event.inputs.pr_number ||
      format('run-{0}', github.run_id)
    }}
  cancel-in-progress: false

jobs:
  # Job name is NOT the required check name. The required context is the
  # Check Run named "review-gate" created below, pinned to the PR head SHA.
  publish:
    if: >
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event_name == 'check_suite' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Post pending review-gate
        id: pending
        uses: actions/github-script@v7
        with:
          script: |
            const CHECK_NAME = 'review-gate';

            function fullSha(value) {
              return typeof value === 'string' && /^[0-9a-f]{40}$/i.test(value)
                ? value.toLowerCase()
                : '';
            }

            async function withRetry(fn, label) {
              const delays = [1000, 2000, 4000];
              let last;
              for (let i = 0; i <= delays.length; i++) {
                try {
                  return await fn();
                } catch (err) {
                  last = err;
                  const status = err && err.status;
                  if (!(status >= 500 && status <= 599) || i === delays.length) throw err;
                  core.warning(`${label}: GitHub API ${status}, retrying in ${delays[i]}ms`);
                  await new Promise(r => setTimeout(r, delays[i]));
                }
              }
              throw last;
            }

            async function createPending(headSha) {
              await withRetry(() => github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: CHECK_NAME,
                head_sha: headSha,
                status: 'in_progress',
                output: {
                  title: 'Evaluating Codex review',
                  summary: 'review-gate is evaluating current review evidence. Merge stays blocked until this check completes.',
                },
              }), `pending ${headSha.slice(0, 7)}`);
            }

            const shas = new Set();
            const payloadPr = context.payload.pull_request;
            if (payloadPr && payloadPr.head) {
              const sha = fullSha(payloadPr.head.sha);
              if (sha) shas.add(sha);
            }

            if (shas.size === 0 && context.payload.issue && context.payload.issue.pull_request) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.issue.number,
              });
              const sha = fullSha(pr.head.sha);
              if (sha) shas.add(sha);
            }

            if (shas.size === 0 && context.payload.inputs && context.payload.inputs.pr_number) {
              const n = parseInt(context.payload.inputs.pr_number, 10);
              if (!Number.isFinite(n)) throw new Error(`bad pr_number: ${context.payload.inputs.pr_number}`);
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: n,
              });
              const sha = fullSha(pr.head.sha);
              if (sha) shas.add(sha);
            }

            if (shas.size === 0 &&
                (context.eventName === 'schedule' ||
                 context.eventName === 'check_suite' ||
                 context.eventName === 'workflow_dispatch')) {
              const prs = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              for (const pr of prs) {
                const sha = fullSha(pr.head.sha);
                if (sha) shas.add(sha);
              }
            }

            if (shas.size === 0) {
              throw new Error('review-gate could not resolve a 40-character head SHA before evaluation');
            }

            for (const sha of shas) {
              await createPending(sha);
            }
            core.setOutput('shas', Array.from(shas).join(','));
            core.info(`Posted pending review-gate on ${shas.size} head SHA(s).`);

      - name: Evaluate and publish review-gate
        id: gate
        uses: actions/github-script@v7
        env:
          PENDING_SHAS: ${{ steps.pending.outputs.shas }}
        with:
          script: |
            const CODEX_LOGINS = new Set([
              'chatgpt-codex-connector',
              'chatgpt-codex-connector[bot]',
            ]);
            const WAIVE_LABEL = 'codex-waived';
            // Only these accounts may authorize a waiver. Label presence alone
            // is not trusted; the labeled-event actor is verified.
            const WAIVER_ACTORS = new Set(['up2itnow0822']);
            const CHECK_NAME = 'review-gate';

            function isCodexLogin(login) {
              return !!login && CODEX_LOGINS.has(login);
            }

            function isCodexUser(user) {
              return !!user && user.type === 'Bot' && isCodexLogin(user.login);
            }

            function fullSha(value) {
              return typeof value === 'string' && /^[0-9a-f]{40}$/i.test(value)
                ? value.toLowerCase()
                : '';
            }

            function sameSha(left, right) {
              const a = fullSha(left);
              const b = fullSha(right);
              return a !== '' && a === b;
            }

            // Keep in sync with scripts/review-gate-evidence.js
            // Prefixes are compared to the current 40-char head only.
            // Never resolve an abbreviation to some other commit.
            function shaPrefixMatches(shown, headSha) {
              const prefix = typeof shown === 'string' && /^[0-9a-f]{7,40}$/i.test(shown)
                ? shown.toLowerCase()
                : '';
              const head = fullSha(headSha);
              return prefix !== '' && head !== '' && head.startsWith(prefix);
            }

            const MENTIONED_SHA =
              /`([0-9a-fA-F]{7,40})`|"commit_sha"\s*:\s*"([0-9a-fA-F]{7,40})"/g;

            function mentionedShas(body) {
              const found = [];
              const text = body || '';
              const re = new RegExp(MENTIONED_SHA.source, 'g');
              let m;
              while ((m = re.exec(text)) !== null) {
                found.push((m[1] || m[2]).toLowerCase());
              }
              return found;
            }

            function mentionsNonHeadSha(body, headSha) {
              return mentionedShas(body).some(s => !shaPrefixMatches(s, headSha));
            }

            function isCleanNoMajorIssuesBody(body) {
              return /didn't find any major issues/i.test(body || '');
            }

            const SUMMARY_MARKER = '<!-- codex-pull-request-review-summary -->';
            const COMPLETED_ROW =
              /^\|[^|\n]*\bCode Review\b[^|\n]*\|[^|\n]*\bCompleted\b[^|\n]*\|\s*`([0-9a-fA-F]{7,40})`\s*\|/gm;

            function summaryTableMarksHeadCompleted(body, headSha) {
              const row = new RegExp(COMPLETED_ROW.source, 'gm');
              let m;
              while ((m = row.exec(body || '')) !== null) {
                if (shaPrefixMatches(m[1], headSha)) return true;
              }
              return false;
            }

            function summaryStateMarksHeadCompleted(body, headSha) {
              const m = /<!--\s*codex-review-state:v1\s+(\{.*?\})\s*-->/.exec(body || '');
              if (!m) return false;
              try {
                const state = JSON.parse(m[1]);
                const cr = state && state.code_review;
                if (!cr || String(cr.status).toLowerCase() !== 'completed') return false;
                return shaPrefixMatches(cr.commit_sha, headSha);
              } catch (err) {
                return false;
              }
            }

            function summaryMarksHeadCompleted(body, headSha) {
              const text = body || '';
              if (!text.includes(SUMMARY_MARKER)) return false;
              return summaryTableMarksHeadCompleted(text, headSha) ||
                summaryStateMarksHeadCompleted(text, headSha);
            }

            function commentAcceptsCleanHead(comment, ctx) {
              const body = (comment && comment.body) || '';
              const updatedMs = Date.parse((comment && (comment.updated_at || comment.created_at)) || 0);
              const createdMs = Date.parse((comment && comment.created_at) || 0);
              const baseChangedMs = Number(ctx && ctx.baseChangedMs) || 0;
              const headSha = (ctx && ctx.headSha) || '';
              if (!(updatedMs > baseChangedMs || createdMs > baseChangedMs)) return false;
              if (mentionsNonHeadSha(body, headSha)) return false;
              if (summaryMarksHeadCompleted(body, headSha)) return true;
              if (isCleanNoMajorIssuesBody(body)) {
                return mentionedShas(body).some(s => shaPrefixMatches(s, headSha));
              }
              return false;
            }

            async function withRetry(fn, label) {
              const delays = [1000, 2000, 4000];
              let last;
              for (let i = 0; i <= delays.length; i++) {
                try {
                  return await fn();
                } catch (err) {
                  last = err;
                  const status = err && err.status;
                  if (!(status >= 500 && status <= 599) || i === delays.length) throw err;
                  core.warning(`${label}: GitHub API ${status}, retrying in ${delays[i]}ms`);
                  await new Promise(r => setTimeout(r, delays[i]));
                }
              }
              throw last;
            }

            function sameNumberSet(left, right) {
              if (left.size !== right.size) return false;
              for (const n of left) if (!right.has(n)) return false;
              return true;
            }

            function pendingShas() {
              return new Set(
                String(process.env.PENDING_SHAS || '')
                  .split(',')
                  .map(s => fullSha(s.trim()))
                  .filter(Boolean)
              );
            }

            async function publishCheck(headSha, verdict, extra = {}) {
              const sha = fullSha(headSha);
              if (!sha) throw new Error('refusing to publish review-gate without a 40-character SHA');
              await withRetry(() => github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: CHECK_NAME,
                head_sha: sha,
                status: 'completed',
                conclusion: verdict.conclusion,
                output: {
                  title: verdict.title,
                  summary: (extra.prefix || '') + verdict.summary + (extra.suffix || ''),
                },
              }), `publish ${sha.slice(0, 7)}`);
              core.info(`${sha.slice(0, 7)} -> ${verdict.conclusion}: ${verdict.title}`);
            }

            // One timeline read: server-side time of the most recent base
            // retarget (or 0) and the latest labeled/unlabeled event for the
            // waiver label.
            async function timelineFacts(prNumber) {
              const events = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              let baseChangedMs = 0;
              let lastWaiverEvent = null;
              for (const e of events) {
                if (e.event === 'base_ref_changed' && e.created_at) {
                  baseChangedMs = Math.max(baseChangedMs, Date.parse(e.created_at));
                }
                if ((e.event === 'labeled' || e.event === 'unlabeled') &&
                    e.label && e.label.name === WAIVE_LABEL) {
                  lastWaiverEvent = e;
                }
              }
              return { baseChangedMs, lastWaiverEvent };
            }

            // A "Codex waived" review-gate check already published by this
            // workflow (github-actions) on this exact head SHA. filter 'all'
            // so a newer failure from an overlapping run cannot hide it.
            async function headHasWaiverCheck(headSha) {
              const runs = await github.paginate(github.rest.checks.listForRef, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
                check_name: CHECK_NAME,
                filter: 'all',
                per_page: 100,
              });
              return runs.some(r =>
                r.app && r.app.slug === 'github-actions' &&
                r.conclusion === 'success' &&
                r.output && r.output.title === 'Codex waived'
              );
            }

            async function resolvePrNumbers() {
              if (context.payload.pull_request) {
                return [context.payload.pull_request.number];
              }
              if (context.payload.issue && context.payload.issue.pull_request) {
                return [context.payload.issue.number];
              }
              if (context.payload.inputs && context.payload.inputs.pr_number) {
                const n = parseInt(context.payload.inputs.pr_number, 10);
                if (!Number.isFinite(n)) throw new Error(`bad pr_number: ${context.payload.inputs.pr_number}`);
                return [n];
              }
              // schedule / check_suite / dispatch-all: every open PR,
              // including drafts so they receive a failing (not missing) gate.
              const prs = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              return prs.map(pr => pr.number);
            }

            async function listSharers(headSha, seedNumbers) {
              const openPrs = await github.paginate(github.rest.pulls.list, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              });
              const set = new Set(seedNumbers);
              for (const p of openPrs) {
                if (sameSha(p.head.sha, headSha)) set.add(p.number);
              }
              return set;
            }

            async function snapshotOf(prNumber) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              const { baseChangedMs } = await timelineFacts(prNumber);
              return `${fullSha(pr.head.sha)}|${pr.base.ref}|${baseChangedMs}`;
            }

            async function evaluate(prNumber) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              const headSha = fullSha(pr.head.sha);
              if (!headSha) {
                return {
                  prNumber, headSha: pr.head.sha,
                  conclusion: 'failure',
                  title: 'Invalid head SHA',
                  summary: 'PR head is not a 40-character SHA; fail-closed.',
                };
              }
              const labels = (pr.labels || []).map(l => l.name);

              const { baseChangedMs, lastWaiverEvent } = await timelineFacts(prNumber);
              const waiverAfterBase =
                lastWaiverEvent &&
                lastWaiverEvent.event === 'labeled' &&
                lastWaiverEvent.actor &&
                WAIVER_ACTORS.has(lastWaiverEvent.actor.login) &&
                Date.parse(lastWaiverEvent.created_at || 0) > baseChangedMs;

              if (labels.includes(WAIVE_LABEL)) {
                const payload = context.payload;
                const sender = (payload.sender && payload.sender.login) || '';
                const payloadPr = payload.pull_request;
                const payloadHead = payloadPr && payloadPr.head && payloadPr.head.sha;
                const payloadBase = payloadPr && payloadPr.base && payloadPr.base.ref;
                const freshWaiver =
                  context.eventName === 'pull_request_target' &&
                  payload.action === 'labeled' &&
                  payload.label && payload.label.name === WAIVE_LABEL &&
                  payloadPr && payloadPr.number === prNumber &&
                  sameSha(payloadHead, headSha) &&
                  payloadBase === pr.base.ref &&
                  waiverAfterBase;
                if (freshWaiver && WAIVER_ACTORS.has(sender)) {
                  return {
                    prNumber, headSha,
                    conclusion: 'success',
                    title: 'Codex waived',
                    summary: `Label \`${WAIVE_LABEL}\` applied by @${sender} on head \`${headSha}\` ` +
                      `for base \`${pr.base.ref}\`. The waiver covers this SHA and base only; ` +
                      'any new push or retarget needs a new review or waiver.',
                  };
                }
                if (freshWaiver) {
                  core.warning(`Label ${WAIVE_LABEL} on #${prNumber} applied by ${sender || 'unknown'}; not an allow-listed waiver actor, ignoring.`);
                } else if (waiverAfterBase && await headHasWaiverCheck(headSha)) {
                  return {
                    prNumber, headSha,
                    conclusion: 'success',
                    title: 'Codex waived',
                    summary: `Waiver previously recorded for head \`${headSha}\` on base \`${pr.base.ref}\`.`,
                  };
                } else {
                  core.warning(`Label ${WAIVE_LABEL} on #${prNumber} is not a this-PR labeled event after the current base on head ${headSha}; re-apply it to waive this head.`);
                }
              }
              if (pr.draft) {
                return {
                  prNumber, headSha,
                  conclusion: 'failure',
                  title: 'Draft PR',
                  summary: 'Draft PRs stay blocked; mark ready for review and wait for Codex on the head.',
                };
              }

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100,
              });
              const codexReviewsOnHead = reviews.filter(r =>
                isCodexUser(r.user) && sameSha(r.commit_id, headSha)
              );
              const dismissedOnHead = codexReviewsOnHead.some(r =>
                String(r.state).toUpperCase() === 'DISMISSED'
              );
              const codexOnHead = codexReviewsOnHead.filter(r =>
                String(r.state).toUpperCase() !== 'DISMISSED' &&
                Date.parse(r.submitted_at || 0) > baseChangedMs
              );

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              });
              const usageLimited = comments.some(c => {
                const body = c.body || '';
                return isCodexUser(c.user) && /usage limits?/i.test(body);
              });

              const cleanPassOnHead = comments.some(c => {
                if (!isCodexUser(c.user)) return false;
                return commentAcceptsCleanHead(c, { headSha, baseChangedMs });
              });
              // Clean-summary fallback is only a no-review/no-findings result.
              // Any Codex review on this head — including a dismissed one —
              // means the summary is not sufficient evidence.
              const acceptedCleanPass =
                cleanPassOnHead && codexReviewsOnHead.length === 0 && !dismissedOnHead;

              if (codexOnHead.length > 0 || acceptedCleanPass) {
                return {
                  prNumber, headSha,
                  conclusion: 'success',
                  title: 'Codex reviewed head',
                  summary: codexOnHead.length > 0
                    ? `chatgpt-codex-connector reviewed \`${headSha}\` (${codexOnHead.length} review(s)).`
                    : `chatgpt-codex-connector completed a clean review of \`${headSha}\` (no findings).`,
                };
              }

              if (usageLimited) {
                return {
                  prNumber, headSha,
                  conclusion: 'failure',
                  title: 'Codex unavailable (usage limit)',
                  summary: `Codex hit usage limits and has not reviewed \`${headSha}\`. ` +
                    `Fail-closed: apply \`${WAIVE_LABEL}\` only with Bill's explicit GO, or wait for quota.`,
                };
              }

              return {
                prNumber, headSha,
                conclusion: 'failure',
                title: 'Waiting for Codex on head',
                summary: `No chatgpt-codex-connector review on \`${headSha}\` yet. ` +
                  `CI alone is not enough. Gate stays red until Codex finishes or \`${WAIVE_LABEL}\` is applied.`,
              };
            }

            async function evaluateSharers(headSha, sharers, first, firstNumber) {
              const results = [];
              for (const m of sharers) {
                const r = m === firstNumber ? first : await evaluate(m);
                if (sameSha(r.headSha, headSha)) results.push(r);
              }
              return results;
            }

            const numbers = await resolvePrNumbers();
            const opened = pendingShas();
            if (numbers.length === 0) {
              for (const sha of opened) {
                await publishCheck(sha, {
                  conclusion: 'failure',
                  title: 'No open PR to evaluate',
                  summary: 'review-gate posted a pending check, then found no open PR for this event.',
                });
              }
              core.info('No open PRs to evaluate.');
              return;
            }

            const done = new Set();
            for (const n of numbers) {
              const beforeFirst = await snapshotOf(n);
              const first = await evaluate(n);
              const headSha = fullSha(first.headSha);
              if (!headSha || done.has(headSha)) continue;
              done.add(headSha);

              let sharers = await listSharers(headSha, [n]);
              const before = new Map();
              for (const m of sharers) {
                before.set(m, m === n ? beforeFirst : await snapshotOf(m));
              }
              let results = await evaluateSharers(headSha, sharers, first, n);
              let failing = results.find(r => r.conclusion !== 'success');
              let verdict = failing || results[0] || first;
              if (!sameSha(verdict.headSha, headSha)) continue;

              let stale = false;
              for (const m of sharers) {
                if ((await snapshotOf(m)) !== before.get(m)) { stale = true; break; }
              }
              if (stale) {
                await publishCheck(headSha, {
                  conclusion: 'failure',
                  title: 'Stale during evaluation',
                  summary: 'Head, base, or retarget time moved while evaluating; not publishing success.',
                });
                continue;
              }

              if (verdict.conclusion === 'success') {
                const freshSharers = await listSharers(headSha, [n]);
                if (!sameNumberSet(sharers, freshSharers)) {
                  await publishCheck(headSha, {
                    conclusion: 'failure',
                    title: 'Head SHA now shared with other PRs',
                    summary: 'Another open PR moved onto this head during evaluation. Not publishing success.',
                  });
                  continue;
                }
                let evidenceStale = false;
                const refreshed = [];
                for (const m of freshSharers) {
                  if ((await snapshotOf(m)) !== before.get(m)) { evidenceStale = true; break; }
                  const r = await evaluate(m);
                  if (!sameSha(r.headSha, headSha)) { evidenceStale = true; break; }
                  refreshed.push(r);
                }
                if (evidenceStale) {
                  await publishCheck(headSha, {
                    conclusion: 'failure',
                    title: 'Stale during evaluation',
                    summary: 'Review, waiver, or PR snapshot changed immediately before publish.',
                  });
                  continue;
                }
                results = refreshed;
                failing = refreshed.find(r => r.conclusion !== 'success');
                verdict = failing || refreshed[0] || verdict;
              }

              const others = results.length > 1
                ? ` Evaluated ${results.length} open PRs sharing this head (#${results.map(r => r.prNumber).join(', #')}).`
                : '';
              const blockedBy = failing && failing.prNumber !== n
                ? `Blocked by PR #${failing.prNumber} (same head): `
                : '';
              await publishCheck(headSha, verdict, { prefix: blockedBy, suffix: others });
            }

            for (const sha of opened) {
              if (!done.has(sha)) {
                await publishCheck(sha, {
                  conclusion: 'failure',
                  title: 'Not evaluated on this run',
                  summary: 'A pending review-gate check was opened but this run did not evaluate the SHA. Fail-closed.',
                });
              }
            }
            core.info(`Published review-gate for ${done.size} head SHA(s).`);

      - name: Complete review-gate as failed after an error
        if: failure()
        uses: actions/github-script@v7
        env:
          PENDING_SHAS: ${{ steps.pending.outputs.shas }}
        with:
          script: |
            const CHECK_NAME = 'review-gate';
            function fullSha(value) {
              return typeof value === 'string' && /^[0-9a-f]{40}$/i.test(value)
                ? value.toLowerCase()
                : '';
            }
            async function withRetry(fn, label) {
              const delays = [1000, 2000, 4000];
              let last;
              for (let i = 0; i <= delays.length; i++) {
                try {
                  return await fn();
                } catch (err) {
                  last = err;
                  const status = err && err.status;
                  if (!(status >= 500 && status <= 599) || i === delays.length) throw err;
                  core.warning(`${label}: GitHub API ${status}, retrying in ${delays[i]}ms`);
                  await new Promise(r => setTimeout(r, delays[i]));
                }
              }
              throw last;
            }
            const shas = new Set(
              String(process.env.PENDING_SHAS || '')
                .split(',')
                .map(s => fullSha(s.trim()))
                .filter(Boolean)
            );
            const payloadPr = context.payload.pull_request;
            if (payloadPr && payloadPr.head) {
              const sha = fullSha(payloadPr.head.sha);
              if (sha) shas.add(sha);
            }
            for (const sha of shas) {
              await withRetry(() => github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: CHECK_NAME,
                head_sha: sha,
                status: 'completed',
                conclusion: 'failure',
                output: {
                  title: 'Gate evaluation failed',
                  summary: 'review-gate crashed or was cancelled after posting a pending check. Fail-closed.',
                },
              }), `failed ${sha.slice(0, 7)}`);
            }
