name: CI (manual only)

on:
  # GitHub-hosted CI is disabled by default for this repo.
  # Use the documented local and Docker runner flows instead.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --if-present || true
      - name: Run tests
        run: npm test --if-present || echo "No tests configured yet"
