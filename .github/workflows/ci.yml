name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Reject unvalidated lockfiles
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "F7: pnpm-lock.yaml is present and not validated" >&2
            exit 1
          fi
          if [ -f yarn.lock ]; then
            echo "F7: yarn.lock is present and not validated" >&2
            exit 1
          fi
      - name: Check dependency sources
        run: node scripts/check-dependency-sources.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run security checks
        run: npm run security
      - name: Build package
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Lint source
        run: npm run lint
      - name: Audit dependencies
        run: npm audit --audit-level=high
