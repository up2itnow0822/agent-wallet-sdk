name: build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the live required context, and make it verify every SDK check.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Reject unvalidated lockfiles
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "F7: pnpm-lock.yaml is present and not validated" >&2
            exit 1
          fi
          if [ -f yarn.lock ]; then
            echo "F7: yarn.lock is present and not validated" >&2
            exit 1
          fi
      - name: Check dependency sources
        run: node scripts/check-dependency-sources.mjs
      - run: npm ci --ignore-scripts
      - run: npm run security
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npm audit --audit-level=high
